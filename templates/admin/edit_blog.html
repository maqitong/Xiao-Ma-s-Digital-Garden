{% extends "admin/layout.html" %}
{% set active_page = "blog" %}

{% block title %}Edit Blog Post{% endblock %}

{% block content %}
<div class="space-y-8">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-6 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
            <h3 class="font-bold text-gray-800 text-lg">Edit Post</h3>
            <a href="/admin/blog" class="text-gray-500 hover:text-gray-700 text-sm">Cancel</a>
        </div>
        <div class="p-6">
            <form action="/admin/blog/edit/{{ post.id }}" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                    <input type="text" name="title" value="{{ post.title }}"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                    <input type="date" name="date" value="{{ post.date }}"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cover Image URL</label>
                    <input type="text" name="cover_image" value="{{ post.cover_image or '' }}" placeholder="/static/..."
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Excerpt (Summary)</label>
                    <textarea name="excerpt" rows="2"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                        required>{{ post.excerpt }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Content (HTML allowed)</label>
                    <textarea name="content" rows="12"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none font-mono text-sm"
                        required>{{ post.content }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tags (comma separated)</label>
                    <input type="text" name="tags" value="{{ post.tags or '' }}" placeholder="Tech, Life, Tutorial"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>
                <div class="md:col-span-2 flex gap-4">
                    <button type="submit" class="px-6 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700">Update
                        Post</button>
                    <a href="/admin/blog"
                        class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
